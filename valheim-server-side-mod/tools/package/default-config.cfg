## Server Authority configuration.
## Anything not listed here is written with its default the first time the server runs.

[Ownership]

## Always = the server simulates everything around every player. This is the point of the mod.
## Vanilla = leave ownership alone. Switch to this to check whether a problem is caused by the mod.
Mode = Always

## Let the server own boats and floating objects, so a drifting boat or a floating log is
## simulated consistently rather than by whichever client happens to be nearest.
##
## This includes a boat somebody is steering, so every passenger gets the same physics no matter
## whose machine is steering. KeepShipOwnedByDriver below is only a fallback for when server
## simulation misbehaves; leave it off.
ServerOwnsWaterborne = true

[Performance]

## Valheim hardcodes 30, which makes every interaction wait up to a frame. 60 fixed noticeable
## pickup lag in testing. Costs CPU: roughly one core at 60 for a single player.
ServerFrameRate = 60

## How often object updates flush to each client, in Hz. Vanilla is 20. Raise if objects the
## server spawns appear late; costs bandwidth per client.
ZdoSendRate = 20

MaxObjectsCreatedPerFrame = 100
ZoneEvictionsPerTick = 0

[Vehicles]

KeepShipOwnedByDriver = false
KeepVehiclesOwnedByUser = true

[Waves]

## Give everything the server simulates the weather at its own position: spawners, rain wear,
## fires, windmills, and the wind and waves under every boat. A raid's weather stays inside the
## raid instead of becoming everyone's. Turn off only to check whether a problem is caused by it.
ServerWeatherPerPosition = true

## Take the wind strength that sets wave height from a blend of the weather that every machine
## computes the same way, ramping over 32m at biome borders and over ten seconds at each weather
## change. Aboard a ship everyone uses the range the ship's owner wrote, so the crew see exactly the
## sea the hull floats on. Must be the same on the server and every client.
BlendedWeatherWind = true

[Debug]

## Everything below except StatusIntervalSeconds exists only in a build made with -p:DebugTools=true.

## One summary line per interval: players, objects simulated, ownership changes. Cheap. Leave on.
## This is the baseline that tells you whether the server is actually simulating anything.
StatusIntervalSeconds = 60

## Logs every single ownership change. Very noisy. Turn on only to chase a specific problem.
LogOwnershipChanges = false

## Logs ship owner, crew, speed and water height twice a second. For boat problems only.
LogShipState = false

## Logs where the nearest sailable water is when a player joins.
LogNearestWaterOnJoin = false

## Cheat hook: lets anyone with file access to this machine spawn items next to a player.
## Off for a real session. See NOTES-diagnostics.txt if you need it for testing.
EnableSpawnRequests = false
